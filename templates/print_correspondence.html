<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print Correspondence - {{ document.reference_number }}</title>
  <!-- Google Fonts Outfit and Inter for premium look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  
  <style>
    :root {
      --letterhead-margin: 2.2in;
      --content-font-size: 16px;
    }

    body {
      background-color: #f3f4f6;
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Premium Control Panel */
    .control-panel {
      width: 100%;
      max-width: 8.5in;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      border-radius: 0 0 12px 12px;
    }

    .panel-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
    }

    .slider-group input[type="range"] {
      cursor: pointer;
      accent-color: #1e3a8a;
      width: 120px;
    }

    .slider-val {
      font-size: 0.85rem;
      font-weight: 500;
      color: #111827;
      min-width: 45px;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #374151;
      border-color: #d1d5db;
    }

    .btn-secondary:hover {
      background-color: #f9fafb;
      border-color: #9ca3af;
    }

    .btn-primary {
      background-color: #1e3a8a;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #172554;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
    }

    /* Page Container representing standard A4/Letter size */
    .page-container {
      width: 8.5in;
      min-height: 11in;
      background-color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      margin: 30px 0;
      padding: 0.5in 0.8in 0.8in 0.8in;
      box-sizing: border-box;
      position: relative;
      transition: padding-top 0.2s ease;
    }

    .letterhead-spacer {
      height: var(--letterhead-margin);
      transition: height 0.2s ease;
    }

    /* Letter layout styles */
    .letter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .recipient-block {
      width: 50%;
      text-align: left;
    }

    .recipient-title {
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .metadata-block {
      width: 45%;
      text-align: right;
    }

    .subject-block {
      text-align: center;
      margin: 35px 0 25px 0;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.4;
      text-transform: uppercase;
      text-decoration: underline;
    }

    .letter-body {
      font-size: var(--content-font-size);
      line-height: 1.6;
      color: #000000;
      margin-bottom: 50px;
      text-align: justify;
    }

    /* Quill Styles compatibility */
    .ql-editor p {
      margin-bottom: 1em;
      white-space: pre-wrap;
    }

    .ql-align-right {
      text-align: right !important;
    }

    .ql-align-center {
      text-align: center !important;
    }

    .ql-align-justify {
      text-align: justify !important;
    }

    .ql-indent-1 {
      padding-left: 3em !important;
    }

    .ql-indent-2 {
      padding-left: 6em !important;
    }

    .ql-indent-3 {
      padding-left: 9em !important;
    }

    .ql-indent-4 {
      padding-left: 12em !important;
    }

    .ql-editor ol, .ql-editor ul {
      padding-left: 1.5em;
      margin-bottom: 1em;
    }

    .ql-editor li {
      margin-bottom: 0.5em;
    }

    /* Signature styling at the bottom */
    .signature-container {
      display: flex;
      justify-content: flex-end;
      page-break-inside: avoid;
    }

    .signature-block {
      text-align: center;
      min-width: 220px;
    }

    .signer-name {
      font-weight: bold;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    .signer-rank-appt {
      font-size: 0.85rem;
      color: #374151;
      margin-top: 2px;
    }

    .signature-date {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 4px;
    }

    /* Hide RESTRICTED classification bands during print/preview */
    .memo-restricted-band {
      display: none !important;
    }

    /* Quill Editor Custom Overrides for Clean Paper Presentation */
    .ql-container.ql-snow {
      border: none !important;
      font-family: 'Inter', Arial, sans-serif !important;
      font-size: var(--content-font-size) !important;
    }
    .ql-editor {
      padding: 0 !important;
      overflow-y: visible !important;
    }

    /* Print styles */
    @media print {
      .ql-tooltip, .ql-clipboard, .ql-hidden {
        display: none !important;
      }
      body {
        background-color: #ffffff;
        color: #000000;
        padding: 0;
        margin: 0;
      }

      .control-panel {
        display: none !important;
      }

      .page-container {
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        min-height: auto !important;
      }

      /* Chrome/Safari print settings */
      @page {
        size: A4;
        margin: 0.6in 0.8in 0.8in 0.8in;
      }
    }
  </style>
</head>
<body>

  <!-- Hidden during printing -->
  <div class="control-panel no-print">
    <div class="panel-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V2h12v7"></path>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
      <span>Print Settings</span>
    </div>

    <!-- Quill Custom Toolbar -->
    <div id="quill-toolbar" style="border: none; background: transparent; padding: 0; margin: 0; display: flex; align-items: center; gap: 8px;">
      <span class="ql-formats" style="margin: 0;">
        <button class="ql-bold" title="Bold"></button>
        <button class="ql-italic" title="Italic"></button>
        <button class="ql-underline" title="Underline"></button>
      </span>
      <span class="ql-formats" style="margin: 0;">
        <button class="ql-list" value="ordered" title="Ordered List"></button>
        <button class="ql-list" value="bullet" title="Bullet List"></button>
      </span>
      <span class="ql-formats" style="margin: 0;">
        <button class="ql-indent" value="-1" title="Decrease Indent"></button>
        <button class="ql-indent" value="+1" title="Increase Indent"></button>
      </span>
      <span class="ql-formats" style="margin: 0; display: inline-flex; align-items: center;">
        <select class="ql-align" title="Alignment"></select>
      </span>
      <span class="ql-formats" style="margin: 0;">
        <button class="ql-clean" title="Clear Formatting"></button>
      </span>
    </div>

    <div class="slider-group">
      <label for="marginSlider">Top Space (Letterhead):</label>
      <input type="range" id="marginSlider" min="1.0" max="4.0" step="0.1" value="2.2">
      <span class="slider-val" id="marginVal">2.2 in</span>
    </div>

    <div class="slider-group">
      <label for="fontSizeSlider">Font Size:</label>
      <input type="range" id="fontSizeSlider" min="12" max="22" step="1" value="16">
      <span class="slider-val" id="fontSizeVal">16 px</span>
    </div>

    <div class="button-group">
      <a href="{{ url_for('open_document_routes.open_document', doc_id=document._id, view_seq=sequence) }}" class="btn btn-secondary">
        &larr; Back to Document
      </a>
      <button onclick="window.print()" class="btn btn-primary">
        Print Letter
      </button>
    </div>
  </div>

  <!-- A4/Letter sheet preview -->
  <div class="page-container">
    <!-- Adjustable space for the letterhead logo and title -->
    <div class="letterhead-spacer" id="letterheadSpacer"></div>

    <!-- Date aligned right on top of the subject -->
    <div style="text-align: right; margin-bottom: 20px; font-weight: 500; font-size: 1rem; outline: none;" contenteditable="true">
      Date: {{ date_str }}
    </div>

    <!-- Centered Subject Line -->
    <div class="subject-block" contenteditable="true" style="outline: none; text-align: center; margin: 25px 0 25px 0; font-weight: 700; font-size: 1.05rem; text-transform: uppercase; text-decoration: underline;">
      <!-- RE: {{ document.memo_title or document.subject }} -->
    </div>

    <!-- Quill Content -->
    <div class="letter-body ql-editor ql-snow" id="letterBody" style="outline: none;">
      {{ content_html | safe }}
    </div>

    <!-- Signature Placeholder (Blank space + Name, Rank, for Office) -->
    <!-- <div class="signature-container">
      <div class="signature-block" style="text-align: right; margin-bottom: 20px; font-weight: 500; font-size: 1rem; outline: none;" contenteditable="true">
        <div class="signer-name">{{ session.get('name', '[NAME]') }}</div>
        <div class="signer-rank-appt" style="font-size: 0.85rem; color: #111827; margin-top: 2px;">{{ session.get('rank', '[RANK]') }}</div>
        <div class="signer-rank-appt" style="font-size: 0.85rem; color: #111827; margin-top: 2px;">for {{ session.get('appt', '[OFFICE]') }}</div>
      </div>
    </div> -->
  </div>

  <script>
    // Live adjustment logic
    const marginSlider = document.getElementById('marginSlider');
    const marginVal = document.getElementById('marginVal');
    const letterheadSpacer = document.getElementById('letterheadSpacer');

    marginSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      marginVal.textContent = val + ' in';
      document.documentElement.style.setProperty('--letterhead-margin', val + 'in');
    });

    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const letterBody = document.getElementById('letterBody');

    fontSizeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      fontSizeVal.textContent = val + ' px';
      document.documentElement.style.setProperty('--content-font-size', val + 'px');
      const editorEl = document.querySelector('.ql-editor');
      if (editorEl) {
        editorEl.style.fontSize = val + 'px';
      }
    });

    // Initialize Quill Editor inside the print preview tab
    const quill = new Quill('#letterBody', {
      theme: 'snow',
      modules: {
        toolbar: '#quill-toolbar',
        keyboard: {
          bindings: {
            tab: {
              key: 9,
              handler: function(range, context) {
                // If it is inside a list, let Quill handle it normally
                if (context.format.list) {
                  return true;
                }
                // Otherwise, indent the current paragraph
                const currentIndent = context.format.indent || 0;
                quill.formatLine(range.index, range.length, 'indent', currentIndent + 1);
                return false;
              }
            },
            'shift-tab': {
              key: 9,
              shiftKey: true,
              handler: function(range, context) {
                if (context.format.list) {
                  return true;
                }
                const currentIndent = context.format.indent || 0;
                if (currentIndent > 0) {
                  quill.formatLine(range.index, range.length, 'indent', currentIndent - 1);
                }
                return false;
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
